<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - 页面不存在</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      :root {
        --main-color: #c62828;
        --main-color-bg: #c6282812;
        --main-site-background: #faf8f5;
        --main-card-background: #ffffff;
        --main-font-color: #2c2c2c;
        --main-card-border: #e8e0d8;
        --main-font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --main-color: #ef5350;
          --main-color-bg: #ef53501a;
          --main-site-background: #1a1515;
          --main-card-background: #211c1c;
          --main-font-color: #f0e6e6;
          --main-card-border: #3d2f2f;
        }
      }
      body {
        font-family: var(--main-font-family);
        background: var(--main-site-background);
        color: var(--main-font-color);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        padding: 1.5rem;
        transition: color 0.3s, background-color 0.3s;
      }
      .container {
        text-align: center;
        animation: fade-up 0.6s 0.1s backwards;
      }
      .code {
        font-size: 6rem;
        font-weight: 800;
        color: var(--main-color);
        line-height: 1;
        margin-bottom: 0.5rem;
        letter-spacing: 0.05em;
      }
      h1 {
        font-size: 1.6rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
      }
      .subtitle {
        font-size: 1.1rem;
        opacity: 0.6;
        margin-bottom: 2rem;
      }
      a {
        display: inline-block;
        padding: 12px 28px;
        font-size: 1rem;
        color: #fff;
        background: var(--main-color);
        border-radius: 10px;
        text-decoration: none;
        transition: opacity 0.3s, transform 0.2s;
      }
      a:hover {
        opacity: 0.85;
        transform: translateY(-1px);
      }
      a:active {
        transform: scale(0.97);
      }
      @keyframes fade-up {
        from { opacity: 0; transform: translateY(20px); }
        to   { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="code">404</div>
      <h1>无法找到请求的页面</h1>
      <p class="subtitle">页面不存在或链接已失效</p>
      <a href="/chinese-youth-notes/">回到主页</a>
    </div>
  </body>
</html>
